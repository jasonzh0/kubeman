name: Tests

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: ruff
      run: uv run ruff check .

    - name: black
      run: uv run black --check .

    - name: mypy
      run: uv run mypy kubeman/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run tests
      run: |
        uv run pytest tests/ -v

    - name: Check package can be imported
      run: |
        uv run python -c "from kubeman import Template, HelmChart, KubernetesResource, TemplateRegistry; print('Import successful!')"
