[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubeman"
dynamic = ["version"]
description = "A Python library for rendering Helm charts and Kubernetes resources with optional ArgoCD Application generation. Features an abstract Template base class for consistent template management."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hazel Sudzilouski", email = "hazel@sudz.com"},
    {name = "Jason Zhang", email = "me@jasonzhang.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
kubeman = "kubeman.cli:main"

[project.urls]
Homepage = "https://github.com/jasonzh0/kubeman"
Repository = "https://github.com/jasonzh0/kubeman"
Issues = "https://github.com/jasonzh0/kubeman/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0.0",
]

[tool.hatch.version]
path = "kubeman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kubeman"]

[tool.hatch.build]
include = ["kubeman/**/*.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "build", "manifests", ".venv"]

[tool.ruff.lint]
# Default rules (pyflakes F, pycodestyle E4/E7/E9) plus warnings.
select = ["E", "F", "W"]
ignore = ["E501"]  # line length is enforced by black, not ruff

[tool.ruff.lint.per-file-ignores]
# Example entrypoints manipulate sys.path before importing template modules.
"examples/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ['^(dist|build|examples)/']

[tool.coverage.run]
source = ["kubeman"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv.sources]
kubeman = { workspace = true }

[dependency-groups]
# Mirrors [project.optional-dependencies].dev so `uv sync` (default) installs
# the full toolchain. ("kubeman" makes uv install the project itself editable.)
dev = [
    "kubeman",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0.0",
]
